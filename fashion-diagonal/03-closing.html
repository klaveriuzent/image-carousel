<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Segoe+UI&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Diagonal — Closing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background-color: #23262E;
    color: #7C93B8;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .watermark {
    position: absolute;
    top: -40px;
    right: -60px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 480px;
    font-weight: 500;
    color: #A6AFC2;
    opacity: 0.1;
    line-height: 1;
  }
  .diagonal {
    position: absolute;
    top: 0;
    left: 96px;
    width: 2px;
    height: 1080px;
    background: #7C93B8;
    transform: rotate(8deg);
    transform-origin: top;
    opacity: 0.6;
  }
  .tag {
    position: absolute;
    top: 90px;
    left: 140px;
    font-size: 20px;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: #A6AFC2;
  }
  .content-title {
    position: absolute;
    left: 140px;
    right: 120px;
    bottom: 260px;
  }
  .content-title h1 {
    font-size: 60px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    line-height: 1.3;
    color: #7C93B8;
    margin-bottom: 26px;
  }
  .content-title p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    letter-spacing: 1px;
    color: #A6AFC2;
  }
  .footer {
    position: absolute;
    bottom: 90px;
    left: 140px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .footer svg { width: 30px; height: 30px; }
  .footer span {
    font-size: 20px;
    letter-spacing: 3px;
    color: #7C93B8;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="watermark">&check;</div>
  <div class="diagonal"></div>
  <div class="tag">Insight &mdash; Fin</div>
  <div class="content-title">
    <h1>{{TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
  </div>
  <div class="footer">
    <svg viewBox="0 0 24 24" fill="#A6AFC2" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
    </svg>
    <span>@jefry-chiedi</span>
  </div>
</body>
</html>
