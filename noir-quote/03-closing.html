<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,500;1,700&family=Tinos:ital@1&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noir Quote — Closing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background-color: #1E2230;
    color: #7C8FB0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .quote-mark {
    position: absolute;
    top: -120px;
    left: 30px;
    font-family: 'Bodoni Moda', serif;
    font-size: 620px;
    font-weight: 700;
    color: #7C8FB0;
    opacity: 0.08;
    line-height: 1;
  }
  .line-left {
    position: absolute;
    top: 90px;
    bottom: 90px;
    left: 90px;
    width: 2px;
    background: #B8A97A;
  }
  .tag {
    position: absolute;
    top: 96px;
    left: 130px;
    font-family: 'Tinos', serif;
    font-style: italic;
    font-size: 26px;
    color: #B8A97A;
    opacity: 0.9;
  }
  .content-title {
    position: absolute;
    left: 130px;
    right: 100px;
    bottom: 260px;
  }
  .content-title h1 {
    font-family: 'Bodoni Moda', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 62px;
    line-height: 1.25;
    color: #7C8FB0;
    margin-bottom: 24px;
  }
  .content-title p {
    font-family: 'Tinos', serif;
    font-style: italic;
    font-size: 24px;
    color: #B8A97A;
  }
  .footer {
    position: absolute;
    bottom: 90px;
    left: 130px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .footer svg { width: 34px; height: 34px; }
  .footer span {
    font-family: 'Tinos', serif;
    font-style: italic;
    font-size: 22px;
    color: #7C8FB0;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="quote-mark">&rdquo;</div>
  <div class="line-left"></div>
  <div class="tag">N&deg;&check;</div>
  <div class="content-title">
    <h1>{{TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
  </div>
  <div class="footer">
    <svg viewBox="0 0 24 24" fill="#B8A97A" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
    </svg>
    <span>@jefry-chiedi</span>
  </div>
</body>
</html>
