<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;0,500&family=Segoe+UI&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calm Editorial — Closing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background-color: #1E2E2C;
    color: #7FAE9C;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-weight: 300;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 120px;
    position: relative;
  }
  .ring {
    width: 96px;
    height: 96px;
    border: 1px solid #7FAE9C;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 34px;
    color: #A9C4BA;
    margin-bottom: 48px;
  }
  .content-title h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 62px;
    line-height: 1.3;
    color: #7FAE9C;
    margin-bottom: 26px;
  }
  .content-title p {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 26px;
    color: #A9C4BA;
  }
  .dot-divider {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #A9C4BA;
    margin-top: 48px;
    opacity: 0.9;
  }
  .corner-dot {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7FAE9C;
    opacity: 0.5;
  }
  .corner-dot.tl { top: 70px; left: 70px; }
  .corner-dot.tr { top: 70px; right: 70px; }
  .corner-dot.bl { bottom: 70px; left: 70px; }
  .corner-dot.br { bottom: 70px; right: 70px; }
  .footer {
    position: absolute;
    bottom: 70px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .footer svg { width: 28px; height: 28px; }
  .footer span {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 24px;
    color: #7FAE9C;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="corner-dot tl"></div>
  <div class="corner-dot tr"></div>
  <div class="corner-dot bl"></div>
  <div class="corner-dot br"></div>
  <div class="ring">&check;</div>
  <div class="content-title">
    <h1>Suka Konten Ini?</h1>
    <p>Follow @jefry-chiedi &amp; simpan post ini untuk insight berikutnya.</p>
  </div>
  <div class="dot-divider"></div>
  <div class="footer">
    <svg viewBox="0 0 24 24" fill="#A9C4BA" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
    </svg>
    <span>@jefry-chiedi</span>
  </div>
</body>
</html>
