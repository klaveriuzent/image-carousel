<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bold Statement — 02 List</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background-color: #4A312E;
    color: #C98E8B;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .tag {
    position: absolute;
    top: 80px;
    left: 90px;
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    letter-spacing: 4px;
    color: #C2996B;
  }
  h1 {
    position: absolute;
    top: 190px;
    left: 90px;
    right: 90px;
    font-family: 'Anton', sans-serif;
    font-size: 72px;
    line-height: 1;
    text-transform: uppercase;
    color: #C98E8B;
  }
  .underline {
    position: absolute;
    left: 90px;
    top: 300px;
    width: 160px;
    height: 12px;
    background: #C2996B;
  }
  .list-copy {
    position: absolute;
    top: 380px;
    left: 90px;
    right: 90px;
    bottom: 200px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 30px;
    -webkit-mask-image: linear-gradient(to bottom, black 82%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 82%, transparent 100%);
  }
  .list-item {
    display: flex;
    align-items: baseline;
    gap: 24px;
  }
  .list-num {
    flex: none;
    font-family: 'Anton', sans-serif;
    font-size: 44px;
    color: #C2996B;
  }
  .list-item p {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    line-height: 1.5;
    color: #C98E8B;
    opacity: 0.9;
  }
  .footer {
    position: absolute;
    bottom: 80px;
    left: 90px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .footer svg { width: 32px; height: 32px; }
  .footer span {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    color: #C98E8B;
    opacity: 0.9;
  }
</style>
</head>
<body>
  <div class="tag">02 / 10</div>
  <h1>3 Poin Penting</h1>
  <div class="underline"></div>
  <div class="list-copy">
    <div class="list-item"><span class="list-num">01</span><p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod.</p></div>
    <div class="list-item"><span class="list-num">02</span><p>Duis aute irure dolor in reprehenderit in voluptate velit esse cillum.</p></div>
    <div class="list-item"><span class="list-num">03</span><p>Excepteur sint occaecat cupidatat non proident, sunt in culpa qui.</p></div>
  </div>
  <div class="footer">
    <svg viewBox="0 0 24 24" fill="#C2996B" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
    </svg>
    <span>@jefry-chiedi</span>
  </div>
</body>
</html>
