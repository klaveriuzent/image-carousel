<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Archive — 02</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background-color: #23252A;
    color: #B7A97A;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    position: relative;
  }
  .border-outer, .border-inner {
    position: absolute;
    border: 1px solid #B7A97A;
    opacity: 0.6;
  }
  .border-outer { top: 50px; left: 50px; right: 50px; bottom: 50px; }
  .border-inner { top: 62px; left: 62px; right: 62px; bottom: 62px; }
  .stamp {
    position: absolute;
    top: 100px;
    left: 100px;
    width: 110px;
    height: 110px;
    border: 3px double #6E9C9C;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 38px;
    color: #6E9C9C;
  }
  h1 {
    position: absolute;
    top: 250px;
    left: 110px;
    right: 110px;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 50px;
    letter-spacing: 1px;
    color: #B7A97A;
  }
  .body-copy {
    position: absolute;
    top: 350px;
    left: 110px;
    right: 110px;
    bottom: 220px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
      -webkit-mask-image: linear-gradient(to bottom, black 82%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 82%, transparent 100%);
  }
  .body-copy p {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 23px;
    line-height: 1.8;
    color: #B7A97A;
    opacity: 0.9;
  }
  .footer {
    position: absolute;
    bottom: 100px;
    left: 110px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .footer svg { width: 32px; height: 32px; }
  .footer span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    color: #B7A97A;
    opacity: 0.9;
  }
</style>
</head>
<body>
  <div class="border-outer"></div>
  <div class="border-inner"></div>
  <div class="stamp">02</div>
  <h1>{{TITLE}}</h1>
  <div class="body-copy">
    <p>{{BODY_1}}</p>
    <p>{{BODY_2}}</p>
    <p>{{BODY_3}}</p>
  </div>
  <div class="footer">
    <svg viewBox="0 0 24 24" fill="#6E9C9C" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
    </svg>
    <span>@jefry-chiedi</span>
  </div>
</body>
</html>
