<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Bold — 01</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background-color: #2E2A28;
    color: #C8734B;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 18px;
    background: #C8734B;
  }
  .diagonal-stripe {
    position: absolute;
    top: -60px;
    right: 120px;
    width: 140px;
    height: 320px;
    background: #D9A06B;
    transform: rotate(18deg);
    opacity: 0.9;
  }
  .tag {
    position: absolute;
    top: 70px;
    left: 90px;
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #D9A06B;
  }
  .page-number {
    position: absolute;
    top: 130px;
    left: 82px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 260px;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 3px #C8734B;
    opacity: 0.9;
  }
  .content-title {
    position: absolute;
    left: 90px;
    right: 90px;
    bottom: 190px;
    max-height: 420px;
    overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, black 82%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 82%, transparent 100%);
  }
  .content-title h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 76px;
    line-height: 1.08;
    text-transform: uppercase;
    color: #C8734B;
  }
  .accent-line {
    position: absolute;
    left: 90px;
    bottom: 160px;
    width: 140px;
    height: 14px;
    background: #D9A06B;
  }
  .linkedin-logo {
    position: absolute;
    top: 968px;
    left: 90px;
    width: 40px;
    height: 40px;
  }
  .linkedin-text {
    position: absolute;
    top: 968px;
    left: 143px;
    height: 40px;
    line-height: 40px;
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    color: #C8734B;
    opacity: 0.9;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="diagonal-stripe"></div>
  <div class="tag">Slide — 01</div>
  <div class="page-number">01</div>
  <div class="accent-line"></div>
  <div class="content-title">
    <h1>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.</h1>
  </div>
  <div class="linkedin-logo">
    <svg viewBox="0 0 24 24" fill="#D9A06B" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
    </svg>
  </div>
  <div class="linkedin-text">@jefry-chiedi</div>
</body>
</html>
