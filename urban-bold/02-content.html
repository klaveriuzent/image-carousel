<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Bold — 02</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background-color: #24262B;
    color: #6E9BFF;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 18px;
    background: #6E9BFF;
  }
  .tag {
    position: absolute;
    top: 70px;
    left: 90px;
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #8FA6C7;
  }
  .page-number {
    position: absolute;
    top: 110px;
    left: 82px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 150px;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 3px #6E9BFF;
    opacity: 0.9;
  }
  h1 {
    position: absolute;
    top: 300px;
    left: 90px;
    right: 90px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 52px;
    line-height: 1.1;
    text-transform: uppercase;
    color: #6E9BFF;
  }
  .accent-line {
    position: absolute;
    left: 90px;
    top: 265px;
    width: 100px;
    height: 10px;
    background: #8FA6C7;
  }
  .body-copy {
    position: absolute;
    top: 420px;
    left: 90px;
    right: 90px;
    bottom: 200px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 26px;
      -webkit-mask-image: linear-gradient(to bottom, black 82%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 82%, transparent 100%);
  }
  .body-copy p {
    font-size: 24px;
    line-height: 1.6;
    text-align: left;
    color: #6E9BFF;
    opacity: 0.9;
    padding-left: 32px;
    position: relative;
  }
  .body-copy p::before {
    content: '—';
    position: absolute;
    left: 0;
    top: 0;
    color: #8FA6C7;
    font-weight: 700;
  }
  .linkedin-logo {
    position: absolute;
    top: 968px;
    left: 90px;
    width: 40px;
    height: 40px;
  }
  .linkedin-text {
    position: absolute;
    top: 968px;
    left: 143px;
    height: 40px;
    line-height: 40px;
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    color: #6E9BFF;
    opacity: 0.9;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="tag">Slide — 02</div>
  <div class="page-number">02</div>
  <div class="accent-line"></div>
  <h1>{{TITLE}}</h1>
  <div class="body-copy">
    <p>{{BODY_1}}</p>
    <p>{{BODY_2}}</p>
    <p>{{BODY_3}}</p>
  </div>
  <div class="linkedin-logo">
    <svg viewBox="0 0 24 24" fill="#8FA6C7" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
    </svg>
  </div>
  <div class="linkedin-text">@jefry-chiedi</div>
</body>
</html>
