<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Grid — Closing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background-color: #1B2E42;
    background-image:
      repeating-linear-gradient(0deg, rgba(126,200,227,0.08) 0px, rgba(126,200,227,0.08) 1px, transparent 1px, transparent 54px),
      repeating-linear-gradient(90deg, rgba(126,200,227,0.08) 0px, rgba(126,200,227,0.08) 1px, transparent 1px, transparent 54px);
    color: #7FB0D0;
    font-family: 'Inter', system-ui, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .corner {
    position: absolute;
    width: 36px;
    height: 36px;
    border-color: #9EC5DC;
    border-style: solid;
    border-width: 0;
  }
  .corner.tl { top: 60px; left: 60px; border-top-width: 3px; border-left-width: 3px; }
  .corner.tr { top: 60px; right: 60px; border-top-width: 3px; border-right-width: 3px; }
  .corner.bl { bottom: 60px; left: 60px; border-bottom-width: 3px; border-left-width: 3px; }
  .corner.br { bottom: 60px; right: 60px; border-bottom-width: 3px; border-right-width: 3px; }
  .label-row {
    position: absolute;
    top: 70px;
    left: 116px;
    right: 116px;
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    letter-spacing: 2px;
    color: #9EC5DC;
  }
  .page-number-box {
    position: absolute;
    top: 150px;
    left: 116px;
    border: 2px solid #7FB0D0;
    padding: 14px 26px;
  }
  .page-number-box span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 40px;
    font-weight: 700;
    color: #7FB0D0;
  }
  .content-title {
    position: absolute;
    left: 116px;
    right: 116px;
    top: 330px;
  }
  .content-title h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 60px;
    line-height: 1.2;
    color: #7FB0D0;
    margin-bottom: 26px;
  }
  .content-title p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    color: #9EC5DC;
  }
  .linkedin-logo {
    position: absolute;
    top: 968px;
    left: 116px;
    width: 36px;
    height: 36px;
  }
</style>
</head>
<body>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="label-row">
    <span>eof / thanks</span>
    <span>@jefry-chiedi</span>
  </div>
  <div class="page-number-box"><span>N&deg;&check;</span></div>
  <div class="content-title">
    <h1>{{TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
  </div>
  <div class="linkedin-logo">
    <svg viewBox="0 0 24 24" fill="#9EC5DC" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
    </svg>
  </div>
</body>
</html>
