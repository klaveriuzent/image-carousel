<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;700&family=Tinos:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editorial Classic — Closing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background-color: #F4F4F3;
    color: #000000;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    position: relative;
  }
  .line-top, .line-bottom { position: absolute; left: 0; right: 0; height: 1px; background: #000000; opacity: 0.6; }
  .line-top { top: 90px; }
  .line-bottom { bottom: 120px; }
  .line-left, .line-right { position: absolute; top: 0; bottom: 0; width: 1px; background: #000000; opacity: 0.6; }
  .line-left { left: 90px; }
  .line-right { right: 90px; }
  .page-number {
    position: absolute;
    top: 78px;
    left: 90px;
    font-size: 108px;
    font-family: 'Tinos', serif;
    color: #000000;
    line-height: 1;
    letter-spacing: 4px;
  }
  .page-number::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 2px;
    width: 100%;
    height: 5px;
    background-color: #0F4C81;
  }
  .line-under-pagenum { position: absolute; top: 196px; left: 0; right: 0; height: 1px; background: #000000; opacity: 0.5; }
  .line-middle { position: absolute; top: 438px; left: 0; right: 0; height: 1px; background: #000000; opacity: 0.5; }
  .content-title {
    position: absolute;
    top: 210px;
    left: 90px;
    right: 90px;
    max-width: 900px;
    margin: 0 auto;
  }
  .content-title h1 {
    font-size: 76px;
    font-weight: 700;
    font-family: 'Bodoni Moda', serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #000000;
    line-height: 1.2;
    margin-bottom: 30px;
  }
  .content-title p {
    font-family: 'Tinos', serif;
    font-style: italic;
    font-size: 26px;
    color: #0F4C81;
  }
  .linkedin-logo { position: absolute; top: 968px; left: 95px; width: 40px; height: 40px; }
  .linkedin-text {
    position: absolute;
    top: 968px;
    left: 148px;
    height: 40px;
    line-height: 40px;
    font-size: 24px;
    font-weight: 500;
    color: #000000;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="line-top"></div>
  <div class="line-bottom"></div>
  <div class="line-left"></div>
  <div class="line-right"></div>
  <div class="linkedin-logo">
    <svg viewBox="0 0 24 24" fill="#0A66C2" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
    </svg>
  </div>
  <div class="linkedin-text">@jefry-chiedi</div>
  <div class="page-number">&check;</div>
  <div class="line-under-pagenum"></div>
  <div class="content-title">
    <h1>{{TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
  </div>
  <div class="line-middle"></div>
</body>
</html>
